name: Build Android APK

# Manuel tetiklemeye geçildi — kullanıcı "APK al" dediğinde GitHub Actions →
# Build Android APK → "Run workflow" butonuyla çalıştırılır.
on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

# Release oluşturmak için GITHUB_TOKEN'a yazma yetkisi gerek (in-app update özelliği)
permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install npm dependencies
        run: npm ci

      - name: Generate version file
        run: |
          SHORT_SHA=${GITHUB_SHA:0:7}
          BUILD_DATE=$(date +%Y-%m-%d)
          BUILD_TIME=$(date +%H:%M)
          cat > src/version.js <<EOF
          export const APP_VERSION = '$SHORT_SHA';
          export const APP_BUILD_DATE = '$BUILD_DATE $BUILD_TIME';
          export const APP_REPO = 'SyntrixCode/restaurant-app';
          EOF
          echo "version=$SHORT_SHA" >> "$GITHUB_OUTPUT"
        id: ver

      - name: Create .env from secrets
        run: |
          cat > .env <<EOF
          VITE_FIREBASE_API_KEY=${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN=${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID=${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET=${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID=${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_USE_FIREBASE_EMULATOR=false
          VITE_SPARK_MODE=true
          EOF

      - name: Build web app (vite)
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Grant execute permission to gradlew
        run: chmod +x android/gradlew

      - name: Build APK (debug)
        if: ${{ github.event.inputs.build_type != 'release' }}
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Build APK (release, unsigned)
        if: ${{ github.event.inputs.build_type == 'release' }}
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Locate APK output
        id: apk
        run: |
          if [ "${{ github.event.inputs.build_type }}" = "release" ]; then
            APK_PATH=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
            APK_NAME="restoran-pos-release-unsigned.apk"
          else
            APK_PATH=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -n 1)
            APK_NAME="restoran-pos-debug.apk"
          fi
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"
          echo "apk_name=$APK_NAME" >> "$GITHUB_OUTPUT"
          ls -lah "$APK_PATH"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.apk_name }}
          path: ${{ steps.apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release (for in-app updates)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ steps.ver.outputs.version }}
          name: "SyntrixPos build ${{ steps.ver.outputs.version }}"
          body: |
            Otomatik build — commit `${{ github.sha }}`
            Build type: `${{ github.event.inputs.build_type }}`

            Bu APK uygulama içinden "Yazılım Güncelle" butonuyla otomatik indirilebilir.
          prerelease: ${{ github.event.inputs.build_type != 'release' }}
          files: ${{ steps.apk.outputs.apk_path }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
