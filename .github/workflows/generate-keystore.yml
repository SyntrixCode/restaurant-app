name: Generate Debug Keystore (one-shot)

# Tek seferlik kullanım: sabit (persistent) bir debug keystore üretir,
# artifact olarak yükler. İndirip android/app/debug.keystore olarak
# commit edilince tüm gelecek APK build'leri aynı imzayı kullanır →
# "Yüklenemedi" hatası kalkmış olur (üzerine yükleme çalışır).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Generate debug keystore
        run: |
          keytool -genkey -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=SyntrixPos Debug,O=SyntrixCode,C=TR"
          ls -lh debug.keystore
          keytool -list -v -keystore debug.keystore -storepass android | head -20

      - name: Upload keystore artifact
        uses: actions/upload-artifact@v4
        with:
          name: debug-keystore
          path: debug.keystore
          if-no-files-found: error
