name: Deploy Firestore Rules & Indexes

on:
  push:
    branches: [main]
    paths:
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - '.github/workflows/deploy-firestore.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy rules & indexes
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install firebase-tools
        run: npm install -g firebase-tools@13

      - name: Write service account credentials
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT secret is missing. Add it in repo Settings → Secrets."
            exit 1
          fi
          echo "$FIREBASE_SERVICE_ACCOUNT" > "$HOME/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$HOME/firebase-service-account.json" >> "$GITHUB_ENV"

      - name: Deploy rules and indexes
        run: |
          firebase deploy \
            --only firestore:rules,firestore:indexes \
            --project alazligida-e77b9 \
            --non-interactive
