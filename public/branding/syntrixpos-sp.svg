<svg xmlns="http://www.w3.org/2000/svg" viewBox="60 180 904 600" role="img" aria-label="SyntrixPos">
  <defs>
    <linearGradient id="paper" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f9fafb"/>
      <stop offset="100%" stop-color="#e5e7eb"/>
    </linearGradient>
    <filter id="paperShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <pattern id="receiptText" x="0" y="0" width="60" height="42" patternUnits="userSpaceOnUse">
      <rect x="6" y="14" width="32" height="6" rx="2" fill="#9ca3af"/>
      <rect x="42" y="14" width="14" height="6" rx="2" fill="#9ca3af"/>
    </pattern>
    <pattern id="receiptText2" x="0" y="0" width="50" height="38" patternUnits="userSpaceOnUse">
      <rect x="4" y="12" width="22" height="5" rx="2" fill="#9ca3af"/>
      <rect x="30" y="12" width="16" height="5" rx="2" fill="#9ca3af"/>
    </pattern>
    <clipPath id="s-clip">
      <text x="285" y="740" font-family="'Inter','SF Pro',system-ui,sans-serif" font-weight="900" font-size="700" text-anchor="middle">S</text>
    </clipPath>
    <clipPath id="p-clip">
      <text x="700" y="740" font-family="'Inter','SF Pro',system-ui,sans-serif" font-weight="900" font-size="700" text-anchor="middle">P</text>
    </clipPath>
  </defs>

  <g filter="url(#paperShadow)">
    <text x="285" y="740" font-family="'Inter','SF Pro',system-ui,sans-serif" font-weight="900" font-size="700" fill="url(#paper)" text-anchor="middle">S</text>
  </g>
  <g clip-path="url(#s-clip)">
    <rect x="0" y="230" width="1024" height="470" fill="url(#receiptText)"/>
  </g>

  <g filter="url(#paperShadow)">
    <text x="700" y="740" font-family="'Inter','SF Pro',system-ui,sans-serif" font-weight="900" font-size="700" fill="url(#paper)" text-anchor="middle">P</text>
  </g>
  <g clip-path="url(#p-clip)">
    <rect x="0" y="230" width="1024" height="470" fill="url(#receiptText2)"/>
  </g>
</svg>
