<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="paper" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f9fafb"/>
      <stop offset="100%" stop-color="#e5e7eb"/>
    </linearGradient>
    <filter id="paperShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <pattern id="dashes1" x="0" y="0" width="44" height="32" patternUnits="userSpaceOnUse">
      <rect x="4" y="10" width="24" height="5" rx="2" fill="#9ca3af"/>
      <rect x="30" y="10" width="10" height="5" rx="2" fill="#9ca3af"/>
    </pattern>
    <pattern id="dashes2" x="0" y="0" width="38" height="28" patternUnits="userSpaceOnUse">
      <rect x="3" y="9" width="16" height="4" rx="2" fill="#9ca3af"/>
      <rect x="22" y="9" width="12" height="4" rx="2" fill="#9ca3af"/>
    </pattern>
    <clipPath id="s-clip">
      <text x="385" y="690" font-family="'Inter','SF Pro',system-ui,sans-serif" font-weight="900" font-size="500" text-anchor="middle">S</text>
    </clipPath>
    <clipPath id="p-clip">
      <text x="640" y="690" font-family="'Inter','SF Pro',system-ui,sans-serif" font-weight="900" font-size="500" text-anchor="middle">P</text>
    </clipPath>
  </defs>

  <g filter="url(#paperShadow)">
    <text x="385" y="690" font-family="'Inter','SF Pro',system-ui,sans-serif" font-weight="900" font-size="500" fill="url(#paper)" text-anchor="middle">S</text>
  </g>
  <g clip-path="url(#s-clip)">
    <rect x="0" y="300" width="1024" height="400" fill="url(#dashes1)"/>
  </g>

  <g filter="url(#paperShadow)">
    <text x="640" y="690" font-family="'Inter','SF Pro',system-ui,sans-serif" font-weight="900" font-size="500" fill="url(#paper)" text-anchor="middle">P</text>
  </g>
  <g clip-path="url(#p-clip)">
    <rect x="0" y="300" width="1024" height="400" fill="url(#dashes2)"/>
  </g>
</svg>
