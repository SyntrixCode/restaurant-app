<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="25" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Yuvarlatılmış kare bg -->
  <rect width="1024" height="1024" rx="220" ry="220" fill="url(#g1)" filter="url(#shadow)"/>

  <!-- "SP" letters interlocked -->
  <g transform="translate(512, 540)">
    <!-- S letter -->
    <text
      x="-180" y="0"
      text-anchor="middle"
      font-family="'Inter', 'SF Pro', system-ui, sans-serif"
      font-weight="900"
      font-size="600"
      fill="white"
      letter-spacing="-50"
      dominant-baseline="middle">S</text>
    <!-- P letter -->
    <text
      x="180" y="0"
      text-anchor="middle"
      font-family="'Inter', 'SF Pro', system-ui, sans-serif"
      font-weight="900"
      font-size="600"
      fill="white"
      letter-spacing="-50"
      dominant-baseline="middle">P</text>
  </g>
</svg>
