<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="g2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
  </defs>
  <!-- Dark navy/black bg -->
  <rect width="1024" height="1024" rx="220" ry="220" fill="url(#g2)"/>

  <!-- "S>" -->
  <g transform="translate(512, 540)">
    <text
      x="-110" y="0"
      text-anchor="middle"
      font-family="'JetBrains Mono', 'Fira Code', monospace"
      font-weight="800"
      font-size="560"
      fill="white"
      dominant-baseline="middle">S</text>
    <!-- > arrow as cursor -->
    <text
      x="200" y="-10"
      text-anchor="middle"
      font-family="'JetBrains Mono', 'Fira Code', monospace"
      font-weight="800"
      font-size="500"
      fill="#3b82f6"
      dominant-baseline="middle">&gt;</text>
    <!-- Blinking-style cursor accent -->
    <rect x="290" y="-180" width="30" height="380" fill="#3b82f6" opacity="0.85"/>
  </g>
</svg>
