<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 600">
  <!-- transparent bg, free-form stacked logo -->

  <!-- { S } centered monogram -->
  <g transform="translate(250, 320)">
    <!-- { (sol parantez, cyan) -->
    <text
      x="-110" y="0"
      text-anchor="end"
      font-family="'JetBrains Mono', 'Fira Code', 'Courier New', monospace"
      font-weight="500"
      font-size="320"
      fill="#06b6d4">{</text>

    <!-- S (orta — tam ortalı, koyu) -->
    <text
      x="0" y="0"
      text-anchor="middle"
      font-family="'Inter', 'SF Pro', system-ui, sans-serif"
      font-weight="900"
      font-size="280"
      fill="#0f172a">S</text>

    <!-- } (sağ parantez, cyan) -->
    <text
      x="110" y="0"
      text-anchor="start"
      font-family="'JetBrains Mono', 'Fira Code', 'Courier New', monospace"
      font-weight="500"
      font-size="320"
      fill="#06b6d4">}</text>
  </g>

  <!-- "code" wordmark — altta -->
  <text
    x="250" y="520"
    text-anchor="middle"
    font-family="'JetBrains Mono', 'Fira Code', 'Courier New', monospace"
    font-weight="700"
    font-size="110"
    fill="#06b6d4"
    letter-spacing="8">code</text>
</svg>
